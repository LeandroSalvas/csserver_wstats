<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="live.title">Live Match - CS 1.6</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css?v=5">
</head>
<body>

<noscript>
  <div class="noscript-warn" role="alert">
    <strong>JavaScript desativado.</strong> Esta página precisa de JavaScript para carregar os dados.
  </div>
</noscript>

  <div class="container">
    <div class="header">
      <h1><span aria-hidden="true">📡</span> <span data-i18n="live.title">Live Match</span></h1>
    </div>

    <div class="page-nav"></div>

    <div id="statusMessage" class="status-message"></div>

    <div class="card">
      <a class="button live-watch-btn" data-watch-link href="#" target="_blank" rel="noopener" data-i18n="server.watchLaunch">Abrir espectador (browser)</a>
      <select id="liveServer" class="server-selector"></select>
      <h2 id="liveHostname" data-i18n="server.hostname">Servidor</h2>

      <div class="live-summary live-summary-3">
        <div class="live-box">
          <span class="live-label" data-i18n="live.currentMap">🎮 Mapa atual</span>
          <strong id="liveMap">-</strong>
        </div>

        <div class="live-box">
          <span class="live-label" data-i18n="live.playersOnline">👥 Players online</span>
          <strong id="liveCount">0</strong>
        </div>

        <div class="live-box">
          <span class="live-label" data-i18n="live.score">⚔️ Placar</span>
          <span class="live-score" id="liveScore">
            <span class="live-score-t" id="liveScoreT">0</span>
            <span class="live-score-sep">:</span>
            <span class="live-score-ct" id="liveScoreCT">0</span>
          </span>
        </div>
      </div>
      <div id="liveScoreAnnounce" class="sr-only" aria-live="polite"></div>
    </div>

    <div class="scoreboard">
      <div class="scoreboard-team scoreboard-t">
        <div class="scoreboard-team-header">
          <span data-i18n="live.terrorists">Terrorists</span>
          <span id="tCount">0 players</span>
        </div>

        <table>
          <caption class="sr-only" data-i18n="live.terrorists">Terroristas</caption>
          <thead>
            <tr>
              <th data-i18n="labels.player">Player</th>
              <th data-i18n="live.status">Status</th>
              <th data-i18n="live.score">Score</th>
              <th data-i18n="labels.deaths">Deaths</th>
	      <th data-i18n="labels.kd">KD</th>
            </tr>
          </thead>
          <tbody id="tPlayers"></tbody>
        </table>
      </div>

      <div class="scoreboard-team scoreboard-ct">
        <div class="scoreboard-team-header">
          <span data-i18n="live.counterTerrorists">Counter-Terrorists</span>
          <span id="ctCount">0 players</span>
        </div>

        <table>
          <caption class="sr-only" data-i18n="live.counterTerrorists">Contra-Terroristas</caption>
          <thead>
            <tr>
              <th data-i18n="labels.player">Player</th>
              <th data-i18n="live.status">Status</th>
              <th data-i18n="live.score">Score</th>
              <th data-i18n="labels.deaths">Deaths</th>
	      <th data-i18n="labels.kd">KD</th>
            </tr>
          </thead>
          <tbody id="ctPlayers"></tbody>
        </table>
      </div>
    </div>
    <div class="card">
  <h2><span aria-hidden="true">🔫</span> <span data-i18n="live.killFeed">Kill Feed</span></h2>
  <div id="killFeed" class="kill-feed">
    <div class="kill-feed-empty" data-i18n="labels.noRecentKills">Nenhuma kill recente.</div>
  </div>
</div>
  </div>

  <script src="/i18n/translations.js?v=4" defer></script>
  <script src="/common.js?v=3" defer></script>
  <script src="/live.js?v=3" defer></script>
</body>
</html>
