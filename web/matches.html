<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="nav.matches">Partidas - CS 1.6 Stats</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>🎮 <span data-i18n="nav.matches">Partidas</span></h1>
      <div class="lang-toggle-slot"></div>
    </div>

    <div class="page-nav"></div>

    <div class="toolbar">
      <select id="matchesServer" class="server-selector"></select>
    </div>

    <div id="statusMessage" class="status-message"></div>

    <div class="card">
      <h2 data-i18n="matches.title">Histórico de Partidas</h2>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th data-i18n="labels.rank">#</th>
              <th data-i18n="labels.map">Mapa</th>
              <th data-i18n="matches.score">Placar</th>
              <th data-i18n="matches.winner">Vencedor</th>
              <th data-i18n="matches.duration">Duração</th>
              <th data-i18n="matches.endedAt">Fim</th>
            </tr>
          </thead>
          <tbody id="matchesTable"></tbody>
        </table>
      </div>

      <div class="pagination">
        <button id="prevPage" class="page-btn" data-i18n="labels.prev">← Anterior</button>
        <span id="pageInfo" class="page-info">1</span>
        <button id="nextPage" class="page-btn" data-i18n="labels.next">Próxima →</button>
      </div>
    </div>
  </div>

  <script src="i18n/translations.js" defer></script>
  <script src="common.js" defer></script>
  <script src="matches.js" defer></script>
</body>
</html>
