<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🎮 CS 1.6 Server Stats</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css?v=10">
</head>
<body>

<noscript>
  <div class="noscript-warn" role="alert">
    <strong>JavaScript desativado.</strong> Esta página precisa de JavaScript para carregar os dados.
  </div>
</noscript>

  <div class="container">
    <div class="header">
      <h1><span aria-hidden="true">🎮</span> CS 1.6 Server Stats</h1>
    </div>

    <div class="page-nav"></div>

    <div class="toolbar">
      <select id="matchesServer" class="server-selector"></select>
    </div>

    <div id="statusMessage" class="status-message"></div>

    <div class="card">
      <h2 data-i18n="matches.title">Histórico de Partidas</h2>
      <div class="table-responsive">
        <table>
          <caption class="sr-only" data-i18n="matches.title">Histórico de Partidas</caption>
          <thead>
            <tr>
              <th data-i18n="labels.rank">#</th>
              <th data-i18n="labels.map">Mapa</th>
              <th data-i18n="matches.score">Placar</th>
              <th data-i18n="matches.winner">Vencedor</th>
              <th data-i18n="matches.duration">Duração</th>
              <th data-i18n="matches.endedAt">Fim</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="matchesTable"></tbody>
        </table>
      </div>

      <div class="pagination">
        <button type="button" id="prevPage" class="page-btn" data-i18n="labels.prev">← Anterior</button>
        <span id="pageInfo" class="page-info">1</span>
        <button type="button" id="nextPage" class="page-btn" data-i18n="labels.next">Próxima →</button>
      </div>
    </div>
  </div>

  <script src="/i18n/translations.js?v=6" defer></script>
  <script src="/common.js?v=6" defer></script>
  <script src="/matches.js?v=3" defer></script>
</body>
</html>
