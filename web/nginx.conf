# Configuração do Nginx do painel web.
#
# Os dois primeiros blocos server (zueira.servecounterstrike.com e
# zueiracstrike.duckdns.org) são específicos da implantação de produção
# (redirecionam HTTP -> HTTPS). Para uso genérico/local, remova-os e mantenha
# apenas o bloco "listen 80 default_server" abaixo.
#
# O endereço público exibido na página "Conectar" é configurado em
# web/common.js (SERVER_HOST / SERVER_PORT).

# Formato de log com $request_time, consumido pelo nginxlog-exporter
# (Prometheus). O formato do exporter em config/nginxlog-exporter.hcl deve
# espelhar exatamente esta linha.
log_format metrics '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent rt=$request_time';

server {
  listen 80;
  server_name zueira.servecounterstrike.com;

  return 301 https://zueiracstrike.duckdns.org:8443$request_uri;
}

server {
  listen 80;
  server_name zueiracstrike.duckdns.org;

  if ($http_x_forwarded_proto != "https") {
    return 301 https://zueiracstrike.duckdns.org:8443$request_uri;
  }

  gzip on;
  gzip_vary on;
  gzip_comp_level 4;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript application/xml application/xml+rss text/javascript image/svg+xml;
  gzip_min_length 256;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # CSP estrita: sem 'unsafe-inline' (sem Google Fonts/inline); o espectador
  # WebRTC entra via iframe (frame-src duckdns:4445). A API é same-origin (/api).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'self' https://zueiracstrike.duckdns.org:4445; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

  root /usr/share/nginx/html;
  index index.html;
  access_log /var/log/nginx/access.log metrics;

  location /api/ {
    # Resolve "api" via o DNS do Docker a cada 10s: evita 502 quando o
    # container da API é recriado com IP novo (setup.sh/servers.sh up).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  location ~* \.(css|jpg|jpeg|png|svg|woff2?|ico|ttf|eot)$ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
    access_log off;
    try_files $uri =404;
  }

  location ~* \.(js|json)$ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
    try_files $uri =404;
  }

  # URLs limpas: remove o .html dos caminhos (rewrite preserva a query string).
  rewrite ^/mapas$ /maps.html last;
  rewrite ^/ranking$ /rankings.html last;
  rewrite ^/avancadas$ /advanced.html last;
  rewrite ^/partidas$ /matches.html last;
  rewrite ^/conectar$ /connect.html last;
  rewrite ^/ao-vivo$ /live.html last;
  rewrite ^/cstv$ /cstv.html last;
  rewrite ^/duelo$ /duelo.html last;
  rewrite ^/admin$ /admin.html last;
  rewrite ^/sistema$ /system.html last;
  rewrite ^/login$ /login.html last;
  rewrite ^/servidores$ /servers.html last;
  rewrite ^/usuarios$ /users.html last;
  rewrite ^/jogador/(.+)$ /player.html?steamid=$1 last;
  rewrite ^/mapa/(.+)$ /map.html?map=$1 last;
  rewrite ^/partida/(.+)$ /partida.html?id=$1 last;

  # Páginas restritas: auth_request valida a sessão (cookie cs16.sid) na API.
  # 200 = admin ativo; 401 redireciona para /login (preservando o destino).
  location = /admin.html {
    auth_request /api/auth/guard;
    error_page 401 = @login_redirect;
    try_files /admin.html =404;
  }
  location = /system.html {
    auth_request /api/auth/guard;
    error_page 401 = @login_redirect;
    try_files /system.html =404;
  }
  location = /servers.html {
    auth_request /api/auth/guard;
    error_page 401 = @login_redirect;
    try_files /servers.html =404;
  }
  location = /users.html {
    auth_request /api/auth/guard;
    error_page 401 = @login_redirect;
    try_files /users.html =404;
  }

  location @login_redirect {
    return 302 /login?next=$request_uri;
  }

  location / {
    try_files $uri $uri.html $uri/ /index.html;
  }
}

