<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🎮 CS 1.6 Server Stats</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css?v=13">
</head>
<body>

<noscript>
  <div class="noscript-warn" role="alert">
    <strong>JavaScript desativado.</strong> Esta página precisa de JavaScript para carregar os dados.
  </div>
</noscript>

  <div class="container">
    <div class="header">
      <h1><span aria-hidden="true">🎮</span> CS 1.6 Server Stats</h1>
    </div>

    <div class="page-nav"></div>

    <div class="toolbar">
      <select id="mapsServer" class="server-selector"></select>
    </div>

    <div id="statusMessage" class="status-message"></div>

    <div class="card">
      <h2 data-i18n="labels.availableMaps">Mapas disponíveis</h2>

      <div class="table-responsive">
        <table>
          <caption class="sr-only" data-i18n="labels.availableMaps">Mapas disponíveis</caption>
          <thead>
            <tr>
              <th data-i18n="labels.rank">#</th>
              <th data-i18n="labels.map">Mapa</th>
              <th data-i18n="labels.matches">Partidas</th>
            </tr>
          </thead>
          <tbody id="mapsTable"></tbody>
        </table>
      </div>

      <div class="pagination" id="mapsPagination">
        <button type="button" id="mapsPrevPage" data-i18n="pagination.prev">← Anterior</button>
        <span id="mapsPageInfo">1</span>
        <button type="button" id="mapsNextPage" data-i18n="pagination.next">Próxima →</button>
      </div>
    </div>
  </div>

  <script src="/i18n/translations.js?v=7" defer></script>
  <script src="/common.js?v=10" defer></script>
  <script src="/maps.js?v=3" defer></script>
</body>
</html>
