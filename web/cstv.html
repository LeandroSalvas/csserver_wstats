<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🎮 CS 1.6 Server Stats</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css?v=9">
</head>
<body>

<noscript>
  <div class="noscript-warn" role="alert">
    <strong>JavaScript desativado.</strong> Esta página precisa de JavaScript para carregar os dados.
  </div>
</noscript>

  <div class="container">
    <div class="header">
      <h1><span aria-hidden="true">🎮</span> CS 1.6 Server Stats</h1>
    </div>

    <div class="page-nav"></div>

    <div id="statusMessage" class="status-message"></div>

    <div class="card">
      <div class="card-header">
        <h2 data-i18n="cstv.watch">Assista a partida ao vivo</h2>
        <select id="cstvServer" class="server-selector"></select>
        <a class="button" data-watch-link href="#" target="_blank" rel="noopener" data-i18n="server.watchLaunch">Abrir espectador (browser)</a>
      </div>
      <iframe class="spectator-frame" data-spectator-frame
        title="CSTV"
        allow="autoplay; fullscreen; microphone; camera"
        referrerpolicy="no-referrer"></iframe>
      <p class="spectator-hint" data-i18n="cstv.hint">Câmera automática. Clique no vídeo para usar teclado e mouse.</p>
    </div>

  </div>

  <script src="/i18n/translations.js?v=5" defer></script>
  <script src="/common.js?v=5" defer></script>
</body>
</html>
