<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="labels.rankingMap">Ranking do mapa - CS 1.6 Stats</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css?v=5">
</head>
<body>

<noscript>
  <div class="noscript-warn" role="alert">
    <strong>JavaScript desativado.</strong> Esta página precisa de JavaScript para carregar os dados.
  </div>
</noscript>

  <div class="container">
    <div class="header">
      <h1 id="mapTitle"><span aria-hidden="true">🗺️</span> <span data-i18n="labels.rankingMap">Ranking do mapa</span></h1>
    </div>

    <div class="page-nav"></div>

    <div class="toolbar">
      <select id="mapServer" class="server-selector"></select>
    </div>

    <div id="statusMessage" class="status-message"></div>

    <div class="card">
      <h2 data-i18n="labels.topJogadores">Top jogadores</h2>

      <div class="table-responsive">
        <table>
          <caption class="sr-only" data-i18n="labels.topJogadores">Top jogadores</caption>
          <thead>
            <tr>
              <th data-i18n="labels.rank">#</th>
              <th data-i18n="labels.player">Player</th>
              <th data-i18n="labels.kills">Kills</th>
              <th data-i18n="labels.deaths">Deaths</th>
              <th data-i18n="labels.hs">HS</th>
              <th data-i18n="labels.kd">KD</th>
              <th data-i18n="labels.skill">Skill</th>
            </tr>
          </thead>
          <tbody id="mapRanking"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/i18n/translations.js?v=4" defer></script>
  <script src="/common.js?v=3" defer></script>
  <script src="/map.js?v=3" defer></script>
</body>
</html>
