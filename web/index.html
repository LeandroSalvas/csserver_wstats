<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CS 1.6 Stats</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css?v=2">
</head>

<body>

<div class="container">

  <div class="header">
    <h1>🎮 CS 1.6 Server Stats</h1>
    <div class="lang-toggle-slot"></div>
  </div>

<div class="page-nav"></div>

  <div id="statusMessage" class="status-message"></div>

  <div class="card server-box">
    <div class="toolbar">
      <select id="serverSelector" class="server-selector"></select>
      <a class="button" href="/ao-vivo" data-i18n="labels.watchLive">Ver partida ao vivo</a>
    </div>
    <h2 id="hostname" data-i18n="server.hostname">Servidor</h2>

    <div class="server-info">
      <div>🎮 <a id="currentMapLink" href="#">-</a></div>
      <div>👥 <span id="playersOnline">-</span>/<span id="maxPlayers">-</span></div>
      <div><span id="serverStatus" class="server-status-online">Online</span></div>
    </div>
  </div>

  <div class="stats-grid">

    <div class="stat-box">
      <h2 id="players">-</h2>
      <span data-i18n="labels.players">Players</span>
    </div>

    <div class="stat-box">
      <h2 id="kills">-</h2>
      <span data-i18n="labels.kills">Total Kills</span>
    </div>

    <div class="stat-box">
      <h2 id="maps">-</h2>
      <span data-i18n="labels.maps">Maps</span>
    </div>


  </div>

  <div class="card last-match-card">
    <div class="last-match-head">
      <h2 data-i18n="match.lastTitle">🕹️ Última Partida</h2>
      <a href="/partidas" data-i18n="match.viewHistory">Ver histórico →</a>
    </div>

    <div id="lastMatchContent" class="last-match-grid" hidden>
      <div class="last-match-main">
        <div class="last-match-map"><a id="lastMatchMap" href="#">-</a></div>
        <div class="last-match-score">
          <span id="lastMatchT" class="match-score match-score-t">-</span>
          <span class="last-match-colon">:</span>
          <span id="lastMatchCT" class="match-score match-score-ct">-</span>
        </div>
        <div id="lastMatchWinner" class="last-match-winner">-</div>
      </div>
      <div class="last-match-meta">
        <div><span data-i18n="match.duration">Duração</span><strong id="lastMatchDuration">-</strong></div>
        <div><span data-i18n="match.date">Data</span><strong id="lastMatchDate">-</strong></div>
        <div><span data-i18n="match.server">Servidor</span><strong id="lastMatchServer">-</strong></div>
      </div>
    </div>

    <div id="lastMatchEmpty" hidden></div>
  </div>

  <div class="card">

    <h2 data-i18n="labels.topPlayers">🏆 Top Players</h2>

    <!-- PODIUM -->
    <div class="podium">

      <div class="podium-player second" id="p2">
        <h3>🥈</h3>
        <div class="name">-</div>
        <div class="stat">-</div>
      </div>

      <div class="podium-player first" id="p1">
        <h3>🥇</h3>
        <div class="name">-</div>
        <div class="stat">-</div>
      </div>

      <div class="podium-player third" id="p3">
        <h3>🥉</h3>
        <div class="name">-</div>
        <div class="stat">-</div>
      </div>

    </div>

    <div class="toolbar">
      <a class="button" href="/ranking" data-i18n="labels.viewFullRanking">Ver ranking completo</a>
    </div>

    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th data-i18n="labels.rank">#</th>
            <th data-i18n="labels.player">Player</th>
            <th data-i18n="labels.kills">Kills</th>
            <th data-i18n="labels.deaths">Deaths</th>
            <th data-i18n="labels.kd">KD</th>
            <th data-i18n="labels.skill">Skill</th>
          </tr>
        </thead>

        <tbody id="ranking"></tbody>
      </table>
    </div>

  </div>

</div>

<script src="i18n/translations.js" defer></script>
<script src="common.js" defer></script>
<script src="app.js" defer></script>
