services:
  # TLS reverse proxy + DDNS (swag + duckdns), integrados à stack.
  #
  # swag expõe:
  #   :8000  -> HTTP  (redireciona para https://...:4443)
  #   :4443  -> HTTPS (site principal: proxy p/ web:8080 via host)
  #   :4445  -> HTTPS (espectadores: /<context>/ -> watch-main 27200+i)
  #
  # O watch-main roda com network_mode: host, então o swag o alcança pelo IP
  # do host (WATCH_UPSTREAM_HOST). O site principal também é alcançado pelo
  # IP do host (192.168.15.54:8080) — independente de rede do compose.
  #
  # ATENÇÃO certcheck: o init-certbot-config/run da imagem swag tem um check
  # "old LE root" quebrado (grepa "ISRG Root X" no emissor, mas a cadeia LE
  # atual é YE2 -> Root YE), então TODO boot revogava e reemitia o cert,
  # queimando a cota do Let's Encrypt (5 certs/168h). O run patcheado é
  # montado por cima do arquivo da imagem (durável em recreate). O arquivo
  # duckdns/init-certbot-config.run é a cópia patcheada do original da imagem.
  swag:
    image: lscr.io/linuxserver/swag:latest
    container_name: swag
    cap_add:
      - NET_ADMIN
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - URL=zueiracstrike.duckdns.org
      - SUBDOMAINS=
      - VALIDATION=duckdns
      - DUCKDNSTOKEN=${DUCKDNS_TOKEN}
      - EMAIL=leandrosalvas@gmail.com
    volumes:
      - ./duckdns/swag/config:/config
      # Patch durável do check "old LE root" (ver comentário acima). Os arquivos
      # de config/certs continuam no volume ./duckdns/swag/config (gitignored).
      - ./duckdns/init-certbot-config.run:/etc/s6-overlay/s6-rc.d/init-certbot-config/run:ro
    ports:
      - "8000:80"
      - "4443:443"
      # Espectador web (WebRTC): TLS dedicado para o proxy do espectador
      - "4445:4445"
    healthcheck:
      test: ["CMD-SHELL", "curl -kfsS https://localhost/ -o /dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Atualiza o registro DNS dinâmico (zueiracstrike.duckdns.org) no DuckDNS.
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: duckdns
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - SUBDOMAINS=zueiracstrike
      - TOKEN=${DUCKDNS_TOKEN}
      - UPDATE_IP=ipv4
      - LOG_FILE=false
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f duck.sh || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
