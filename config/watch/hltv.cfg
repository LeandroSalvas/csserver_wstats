// HLTV relay config (auto-executed from /home/cs16)
// O modulo proxy precisa ser carregado explicitamente antes dos comandos.
loadmodule proxy

// Limita a taxa de ticks do relay (30/s, mesmo teto do sv_maxupdaterate do
// servidor de jogo): reduz a produção de pacotes netchan para o espectador
// web, que consome ~1 pacote/frame. Sem isso o buffer do cliente enchia e o
// descarte do pacote mais antigo quebrava a cadeia delta do HLTV (congelava
// o espectador). O cliente também tem rejoin proativo a 80% do buffer.
sys_ticrate 30

connect 127.0.0.1:27015
delay 15
maxclients 128
name "ZueiraHLTV"
hostname "ZueiraHLTV"
chatmode 1
signoncommands "spec_autodirector 1"
