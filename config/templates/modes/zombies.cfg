// Server config — modo Zombies (Zombie Plague 5.0.8a)
// Template usado por scripts/servers.sh — não edite diretamente.

sv_aim 0
pausable 0
hostname "__HOSTNAME__"
sv_maxspeed 320

// Zombie Plague: rounds longos para gameplay de zumbis
mp_timelimit 0
mp_roundtime 5
mp_roundtime_defuse 5

log on
mp_logfile 1
mp_logdetail 0

sv_cheats 0
exec listip.cfg
exec banned.cfg

rcon_password "__RCON_PASSWORD__"
sv_lan 0

csstats_sql_server "__SERVER_ID__"
csstats_rankbots __RANKBOTS__

sv_visiblemaxplayers __VISIBLE_MAXPLAYERS__

sv_maxrate 0
sv_minrate 0
sv_maxupdaterate 30
sv_minupdaterate 10

sv_region 2

// ZBot config — bots preenchem slots vazios (estilo PodBot)
bot_enable 1
bot_quota 2
bot_quota_mode "fill"
bot_join_after_player 0
bot_difficulty 0
bot_chatter "off"

// Forçar idioma inglês (ignora cl_language do cliente)
amx_client_languages 0
