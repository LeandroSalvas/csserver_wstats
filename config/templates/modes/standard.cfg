// Server config — modo Standard
// Template usado por scripts/servers.sh — não edite diretamente.

// disable autoaim
sv_aim 0

// disable clients' ability to pause the server
pausable 0

// default server name
hostname "__HOSTNAME__"

// maximum client movement speed
sv_maxspeed 320

// 20 minute timelimit
mp_timelimit 20

// enable game logging (needed by AMX Mod X logevents that count rounds)
log on
mp_logfile 1
mp_logdetail 0

sv_cheats 0

// load ban files
exec listip.cfg
exec banned.cfg

// rcon_password must match RCON_PASSWORD in .env
rcon_password "__RCON_PASSWORD__"

// modo internet (sv_lan 0): obrigatório para ReHLDS+ReUnion no modo internet
sv_lan 0

// id do servidor gravado em csstats.server_name (deve bater com config/servers.list)
csstats_sql_server "__SERVER_ID__"

// grava stats de bots (1) ou apenas humanos (0); frag (teste/bots) usa 1
csstats_rankbots __RANKBOTS__

sv_visiblemaxplayers __VISIBLE_MAXPLAYERS__

sv_maxrate 0
sv_minrate 0
sv_maxupdaterate 30
sv_minupdaterate 10

sv_region 2

// ZBot config — bots preenchem slots vazios (estilo PodBot)
bot_enable 1
bot_quota 2
bot_quota_mode "fill"
bot_join_after_player 0
bot_difficulty 1
bot_chatter "off"
