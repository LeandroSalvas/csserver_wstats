// Server config — modo Surf
// Template usado por scripts/servers.sh — não edite diretamente.

sv_aim 0
pausable 0
hostname "__HOSTNAME__"
sv_maxspeed 320

// Surf: rounds longos, sem limite de tempo
mp_timelimit 0
mp_roundtime 999
mp_roundtime_defuse 999

log on
mp_logfile 1
mp_logdetail 0

sv_cheats 0
exec listip.cfg
exec banned.cfg

rcon_password "__RCON_PASSWORD__"
sv_lan 0

csstats_sql_server "__SERVER_ID__"
csstats_rankbots __RANKBOTS__

sv_visiblemaxplayers __VISIBLE_MAXPLAYERS__

sv_maxrate 0
sv_minrate 0
sv_maxupdaterate 30
sv_minupdaterate 10

sv_region 2

// Surf: airaccelerate alto é essencial
sv_airaccelerate 100

// ZBot: surf não usa bots
bot_enable 0

// Forçar idioma inglês (ignora cl_language do cliente)
amx_client_languages 0
