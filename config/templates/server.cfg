// Use this file to configure your DEDICATED server.
// This config file is executed on server start.
// Template usado por scripts/servers.sh — não edite diretamente.

// disable autoaim
sv_aim 0

// disable clients' ability to pause the server
pausable 0

// default server name
hostname "__HOSTNAME__"

// maximum client movement speed
sv_maxspeed 320

// 20 minute timelimit
mp_timelimit 20

// enable game logging (needed by AMX Mod X logevents that count rounds)
log on
mp_logfile 1
mp_logdetail 0

sv_cheats 0

// load ban files
exec listip.cfg
exec banned.cfg

// rcon_password must match RCON_PASSWORD in .env
rcon_password "__RCON_PASSWORD__"

// id do servidor gravado em csstats.server_name (deve bater com config/servers.list)
csstats_sql_server "__SERVER_ID__"

// grava stats de bots (1) ou apenas humanos (0); frag (teste/bots) usa 1
csstats_rankbots __RANKBOTS__

// Capacidade anunciada ("salas") = vagas visíveis (número par do servers.list).
// O maxplayers real (vindo do +maxplayers) é vagas_visíveis + 1: o slot extra é
// reservado ao HLTV (plugin slots_reserve.amxx barra o próximo player humano).
sv_visiblemaxplayers __VISIBLE_MAXPLAYERS__

sv_maxrate 0
sv_minrate 0
sv_maxupdaterate 30
sv_minupdaterate 10


sv_region 255
