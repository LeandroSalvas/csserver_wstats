name: Discord changelog

on:
  push:
    branches: [main]
  workflow_dispatch:   # teste manual sem push

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
          COMMITS: ${{ toJson(github.event.commits) }}
          REF: ${{ github.ref_name }}
          COMPARE: ${{ github.event.compare }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ -z "$WEBHOOK" ] && echo "secret DISCORD_CHANGELOG_WEBHOOK vazio; saindo" && exit 0
          echo "webhook len: ${#WEBHOOK}"
          # workflow_dispatch não traz commits/compare — posta mesmo assim (teste do webhook)
          if [ -z "$COMMITS" ] || [ "$COMMITS" = "null" ]; then
            BODY="(teste manual — sem lista de commits)"
          else
            BODY="$(jq -rn --argjson c "$COMMITS" '
              ($c | map(("- **" + (.message | split("\n")[0]) + "** — " + .author.name)) | join("\n"))')"
            [ ${#BODY} -gt 1850 ] && BODY="${BODY:0:1847}..."
          fi
          if [ -z "$COMPARE" ] || [ "$COMPARE" = "null" ]; then
            COMPARE="https://github.com/$REPO"
          fi
          TEXT="**📦 Push para \`$REF\`** ($REPO)\n\n$BODY\n\n🔗 $COMPARE"
          HTTP=$(jq -n --arg c "$TEXT" '{content: $c}' \
              | curl -sS -f -H "Content-Type: application/json" -d @- "$WEBHOOK" -o /dev/null -w "%{http_code}") && RC=0 || RC=$?
          if [ "$RC" -ne 0 ]; then
            echo "falha ao postar no Discord (curl exit $RC, http ${HTTP:-?}) — confira o secret DISCORD_CHANGELOG_WEBHOOK"
            exit 1
          fi
          echo "discord: $HTTP"
