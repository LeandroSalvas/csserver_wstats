services:
  cs16:
    build: ./cs16
    image: cs16_stats:local
    restart: always
    depends_on:
      - db
    environment:
      # Todos os containers usam a porta interna 27015; o publish no host fica no ports.
      PORT: "27015"
      MAP: "de_dust2"
      # CS 1.6 limita +maxplayers em 32: numa sala de 32 não existe slot oculto
      # (+1); o slot do HLTV é garantido pelo plugin slots_reserve (que barra o
      # 32º ocupante não-HLTV). sv_visiblemaxplayers 32 == maxplayers real (no-op).
      MAXPLAYERS: "32"
      SERVER_ID: "main"
    volumes:
      - ./config/servers/main/server.cfg:/home/cs16/cstrike/server.cfg
      - ./config/servers/main/users.ini:/home/cs16/cstrike/addons/amxmodx/configs/users.ini
      - ./config/servers/main/amxx.cfg:/home/cs16/cstrike/addons/amxmodx/configs/amxx.cfg
      - ./config/servers/main/mapcycle.txt:/home/cs16/cstrike/mapcycle.txt
      - ./config/servers/main/motd.txt:/home/cs16/cstrike/motd.txt
      - ./config/servers/main/plugins.ini:/home/cs16/cstrike/addons/amxmodx/configs/plugins.ini
      - ./live/main/live_scoreboard.json:/home/cs16/cstrike/addons/amxmodx/data/live/live_scoreboard.json
      - ./live/main/live_killfeed.json:/home/cs16/cstrike/addons/amxmodx/data/live/live_killfeed.json
      - ./cs16/plugins/live_scoreboard.amxx:/home/cs16/cstrike/addons/amxmodx/plugins/live_scoreboard.amxx
      - ./cs16/plugins/live_killfeed.amxx:/home/cs16/cstrike/addons/amxmodx/plugins/live_killfeed.amxx
      - ./cs16/plugins/csstatsx_sql.amxx:/home/cs16/cstrike/addons/amxmodx/plugins/csstatsx_sql.amxx
      - ./cs16/plugins/slots_reserve.amxx:/home/cs16/cstrike/addons/amxmodx/plugins/slots_reserve.amxx
      - ./cs16/plugins/adminslots.amxx:/home/cs16/cstrike/addons/amxmodx/plugins/adminslots.amxx

    ports:
      - "27015:27015/udp"
      - "27015:27015/tcp"
    security_opt:
      - seccomp=unconfined
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 512M
        reservations:
          memory: 128M


  db:
    image: mariadb:10.6
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      # Schema p/ stack nova (só roda na primeira inicialização do volume):
      # cria a tabela users antes da API subir. Para bancos existentes o
      # ensureSchema() da API aplica a mesma DDL de forma idempotente.
      - ./api/sql:/docker-entrypoint-initdb.d:ro
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20


  api:
    build: ./api
    container_name: cs16-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_STORE: ${SESSION_STORE:-redis}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      GAMEDIG_HOST: ${GAMEDIG_HOST:-cs16}
      GAMEDIG_PORT: ${GAMEDIG_PORT:-27015}
      RCON_PASSWORD: ${RCON_PASSWORD}
      # Fallback de desenvolvimento (sem config/servers.list montado). Em
      # produção a API lê a lista em tempo de execução (serverCtx), então o
      # override NÃO define este valor — api estática, sem recriação no add/remove.
      CS_SERVERS: ${CS_SERVERS:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_ALLOWED_ROLE_IDS: ${DISCORD_ALLOWED_ROLE_IDS:-}
      DISCORD_ALLOWED_USER_IDS: ${DISCORD_ALLOWED_USER_IDS:-}
      STEAM_RETURN_URL: ${STEAM_RETURN_URL:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      METRICS_USER: ${METRICS_USER:-}
      METRICS_PASS: ${METRICS_PASS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_RETURN_URL: ${GOOGLE_RETURN_URL:-}
      # Base pública dos espectadores — a API deriva o spectatorUrl por servidor
      # do contexto em config/servers.list (sem CS_SERVERS no compose: serviço
      # api fica estático e add/remove não recriam containers em cascata).
      WATCH_PUBLIC_BASE: ${WATCH_PUBLIC_BASE:-}
      SEED_ADMIN: ${SEED_ADMIN:-1}
      SERVER_MANAGER_PROVIDER: ${SERVER_MANAGER_PROVIDER:-docker}
      SERVER_REPO_DIR: ${SERVER_REPO_DIR:-/repo}
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
#    ports:
#      - "3000:3000"  
    volumes: 
      - ./live/main/live_scoreboard.json:/live_data/main/live_scoreboard.json:ro
      - ./live/main/live_killfeed.json:/live_data/main/live_killfeed.json:ro
      # Controle dos servidores (serverManager): socket docker + repo do host.
      # O container api vira o "control plane" da stack — acesso restrito às
      # rotas admin (requireAdmin/auth_request).
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/repo
      
  web:
    image: nginx:alpine
    container_name: cs16-web
    depends_on:
      - api
    ports:
      - "8080:80"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          memory: 32M
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Access log persistido no host para o nginxlog-exporter ler (ro).
      - ./live/nginx-logs:/var/log/nginx
    restart: always

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: cs16-nginx-exporter
    restart: always
    depends_on:
      - web
    command:
      - -nginx.scrape-uri=http://web:80/stub_status

  nginxlog-exporter:
    image: quay.io/martinhelmich/prometheus-nginxlog-exporter:v1
    container_name: cs16-nginxlog-exporter
    restart: always
    depends_on:
      - web
    volumes:
      - ./live/nginx-logs:/var/log/nginx:ro
      - ./config/nginxlog-exporter.hcl:/etc/prometheus-nginxlog-exporter.hcl:ro
    command:
      - -config-file
      - /etc/prometheus-nginxlog-exporter.hcl

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: cs16-prometheus
    restart: always
    depends_on:
      - api
    environment:
      METRICS_USER: ${METRICS_USER:-}
      METRICS_PASS: ${METRICS_PASS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M
    volumes:
      # O Prometheus nao expande variaveis no --config.file; o config efetivo
      # (com as credenciais reais no lugar de __METRICS_USER__/__METRICS_PASS__)
      # e gerado para /tmp/prometheus.yml pelo wrapper sh abaixo.
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sed -e "s/__METRICS_USER__/$$METRICS_USER/g" \
            -e "s/__METRICS_PASS__/$$METRICS_PASS/g" \
            /etc/prometheus/prometheus.yml > /tmp/prometheus.yml
        exec /bin/prometheus --config.file=/tmp/prometheus.yml \
          --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=30d \
          --web.console.libraries=/usr/share/prometheus/console_libraries \
          --web.console.templates=/usr/share/prometheus/consoles \
          --web.enable-admin-api --web.enable-lifecycle

  grafana:
    image: grafana/grafana:11.1.0
    container_name: cs16-grafana
    restart: always
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 64M
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"

  # Métricas do HOST (CPU/memória/rede da interface física). network_mode: host
  # é obrigatório: os contadores de rede (/proc/net/dev) são por namespace — sem
  # isso o exporter veria só as interfaces do próprio container, não o eno1.
  # O Prometheus o alcança via host-gateway (extra_hosts no serviço prometheus).
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: cs16-node-exporter
    restart: always
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro,rslave
    command:
      - --path.rootfs=/host

  # Métricas POR CONTAINER (CPU/memória/rede da stack). privileged para ler
  # cgroup; monta o rootfs do host read-only. Porta 8082 só p/ debug local.
  # Imagem = fork com fix para o containerd snapshotter (ver cadvisor/Dockerfile).
  cadvisor:
    build: ./cadvisor
    image: cs16-cadvisor:local
    container_name: cs16-cadvisor
    restart: always
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    ports:
      - "127.0.0.1:8082:8080"
    command:
      - --docker_only=true
      - --housekeeping_interval=10s


volumes:
  db_data:
  redis_data:
  prometheus_data:
  grafana_data:
