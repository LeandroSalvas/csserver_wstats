# Gerado por scripts/servers.sh compose — não edite manualmente.
# Consulte config/servers.list para alterar os servidores.
services:
  cs16:
    build: ./cs16
    image: cs16_stats:local
    environment:
      PORT: "27015"
      MAP: "de_dust2"
      MAXPLAYERS: "31"
      SERVER_ID: "main"
  cs16fypooldayonly:
    image: cs16_stats:local
    restart: always
    environment:
      PORT: "27015"
      MAP: "fy_pool_day"
      MAXPLAYERS: "9"
      SERVER_ID: "fypooldayonly"
    ports:
      - "27016:27015/udp"
      - "27016:27015/tcp"
    security_opt:
      - seccomp=unconfined
    volumes:
      - ./config/servers/fypooldayonly/server.cfg:/home/cs16/cstrike/server.cfg
      - ./config/servers/fypooldayonly/users.ini:/home/cs16/cstrike/addons/amxmodx/configs/users.ini
      - ./config/servers/fypooldayonly/amxx.cfg:/home/cs16/cstrike/addons/amxmodx/configs/amxx.cfg
      - ./config/servers/fypooldayonly/mapcycle.txt:/home/cs16/cstrike/mapcycle.txt
      - ./config/servers/fypooldayonly/motd.txt:/home/cs16/cstrike/motd.txt
      - ./config/servers/fypooldayonly/plugins.ini:/home/cs16/cstrike/addons/amxmodx/configs/plugins.ini
      - ./cs/plugins/live_scoreboard.amxx:/home/cs16/cstrike/addons/amxmodx/plugins/live_scoreboard.amxx
      - ./cs/plugins/live_killfeed.amxx:/home/cs16/cstrike/addons/amxmodx/plugins/live_killfeed.amxx
      - ./cs/plugins/csstatsx_sql.amxx:/home/cs16/cstrike/addons/amxmodx/plugins/csstatsx_sql.amxx
      - ./cs/plugins/slots_reserve.amxx:/home/cs16/cstrike/addons/amxmodx/plugins/slots_reserve.amxx
      - ./live/fypooldayonly/live_scoreboard.json:/home/cs16/cstrike/addons/amxmodx/data/live/live_scoreboard.json
      - ./live/fypooldayonly/live_killfeed.json:/home/cs16/cstrike/addons/amxmodx/data/live/live_killfeed.json
  cs16zueira2:
    image: cs16_stats:local
    restart: always
    environment:
      PORT: "27015"
      MAP: "de_dust"
      MAXPLAYERS: "17"
      SERVER_ID: "zueira2"
    ports:
      - "27017:27015/udp"
      - "27017:27015/tcp"
    security_opt:
      - seccomp=unconfined
    volumes:
      - ./config/servers/zueira2/server.cfg:/home/cs16/cstrike/server.cfg
      - ./config/servers/zueira2/users.ini:/home/cs16/cstrike/addons/amxmodx/configs/users.ini
      - ./config/servers/zueira2/amxx.cfg:/home/cs16/cstrike/addons/amxmodx/configs/amxx.cfg
      - ./config/servers/zueira2/mapcycle.txt:/home/cs16/cstrike/mapcycle.txt
      - ./config/servers/zueira2/motd.txt:/home/cs16/cstrike/motd.txt
      - ./config/servers/zueira2/plugins.ini:/home/cs16/cstrike/addons/amxmodx/configs/plugins.ini
      - ./cs/plugins/live_scoreboard.amxx:/home/cs16/cstrike/addons/amxmodx/plugins/live_scoreboard.amxx
      - ./cs/plugins/live_killfeed.amxx:/home/cs16/cstrike/addons/amxmodx/plugins/live_killfeed.amxx
      - ./cs/plugins/csstatsx_sql.amxx:/home/cs16/cstrike/addons/amxmodx/plugins/csstatsx_sql.amxx
      - ./cs/plugins/slots_reserve.amxx:/home/cs16/cstrike/addons/amxmodx/plugins/slots_reserve.amxx
      - ./live/zueira2/live_scoreboard.json:/home/cs16/cstrike/addons/amxmodx/data/live/live_scoreboard.json
      - ./live/zueira2/live_killfeed.json:/home/cs16/cstrike/addons/amxmodx/data/live/live_killfeed.json
  cs16supertestserver:
    image: cs16_stats:local
    restart: always
    environment:
      PORT: "27015"
      MAP: "cs_assault"
      MAXPLAYERS: "31"
      SERVER_ID: "supertestserver"
    ports:
      - "27018:27015/udp"
      - "27018:27015/tcp"
    security_opt:
      - seccomp=unconfined
    volumes:
      - ./config/servers/supertestserver/server.cfg:/home/cs16/cstrike/server.cfg
      - ./config/servers/supertestserver/users.ini:/home/cs16/cstrike/addons/amxmodx/configs/users.ini
      - ./config/servers/supertestserver/amxx.cfg:/home/cs16/cstrike/addons/amxmodx/configs/amxx.cfg
      - ./config/servers/supertestserver/mapcycle.txt:/home/cs16/cstrike/mapcycle.txt
      - ./config/servers/supertestserver/motd.txt:/home/cs16/cstrike/motd.txt
      - ./config/servers/supertestserver/plugins.ini:/home/cs16/cstrike/addons/amxmodx/configs/plugins.ini
      - ./cs/plugins/live_scoreboard.amxx:/home/cs16/cstrike/addons/amxmodx/plugins/live_scoreboard.amxx
      - ./cs/plugins/live_killfeed.amxx:/home/cs16/cstrike/addons/amxmodx/plugins/live_killfeed.amxx
      - ./cs/plugins/csstatsx_sql.amxx:/home/cs16/cstrike/addons/amxmodx/plugins/csstatsx_sql.amxx
      - ./cs/plugins/slots_reserve.amxx:/home/cs16/cstrike/addons/amxmodx/plugins/slots_reserve.amxx
      - ./live/supertestserver/live_scoreboard.json:/home/cs16/cstrike/addons/amxmodx/data/live/live_scoreboard.json
      - ./live/supertestserver/live_killfeed.json:/home/cs16/cstrike/addons/amxmodx/data/live/live_killfeed.json
