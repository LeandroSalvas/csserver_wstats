# Gerado por scripts/servers.sh compose — não edite manualmente.
# Consulte config/servers.list para alterar os servidores.
services:
  cs16:
    build: ./cs16
    image: cs16_stats:local
    environment:
      PORT: "27015"
      MAP: "de_dust2"
      MAXPLAYERS: "31"
      SERVER_ID: "main"
  cs16gungame:
    image: cs16_stats:local
    restart: always
    environment:
      PORT: "27015"
      MAP: "fy_iceworld"
      MAXPLAYERS: "17"
      SERVER_ID: "gungame"
    ports:
      - "27016:27015/udp"
      - "27016:27015/tcp"
    security_opt:
      - seccomp=unconfined
    volumes:
      - ./config/servers/gungame/server.cfg:/home/cs16/cstrike/server.cfg
      - ./config/servers/gungame/users.ini:/home/cs16/cstrike/addons/amxmodx/configs/users.ini
      - ./config/servers/gungame/amxx.cfg:/home/cs16/cstrike/addons/amxmodx/configs/amxx.cfg
      - ./config/servers/gungame/mapcycle.txt:/home/cs16/cstrike/mapcycle.txt
      - ./config/servers/gungame/motd.txt:/home/cs16/cstrike/motd.txt
      - ./config/servers/gungame/plugins.ini:/home/cs16/cstrike/addons/amxmodx/configs/plugins.ini
      - ./cs16/plugins/live_scoreboard.amxx:/home/cs16/cstrike/addons/amxmodx/plugins/live_scoreboard.amxx
      - ./cs16/plugins/live_killfeed.amxx:/home/cs16/cstrike/addons/amxmodx/plugins/live_killfeed.amxx
      - ./cs16/plugins/csstatsx_sql.amxx:/home/cs16/cstrike/addons/amxmodx/plugins/csstatsx_sql.amxx
      - ./cs16/plugins/slots_reserve.amxx:/home/cs16/cstrike/addons/amxmodx/plugins/slots_reserve.amxx
      - ./cs16/plugins/adminslots.amxx:/home/cs16/cstrike/addons/amxmodx/plugins/adminslots.amxx
