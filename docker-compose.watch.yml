# Gerado por scripts/servers.sh compose — não edite manualmente.
# Espectador web (opt-in): scripts/watch.sh up|down. Portas por servidor (índice na lista):
#   relay HLTV UDP 27100+i | watch-main TCP 27200+i | WebRTC UDP 27300+(i*64)..+63
services:
  watch-hltv-main:
    image: cs16_stats:local
    container_name: cs16-watch-hltv-main
    restart: unless-stopped
    profiles: ["watch"]
    network_mode: host
    environment:
      LD_LIBRARY_PATH: "/home/cs16"
    entrypoint: ["/home/cs16/start-hltv.sh"]
    volumes:
      - ./config/watch/main/hltv.cfg:/home/cs16/hltv.cfg:ro
      - ./config/watch/main/start-hltv.sh:/home/cs16/start-hltv.sh:ro
      - ./live/watch/main:/home/cs16/watch_logs
    healthcheck:
      test: ["CMD", "test", "-f", "/home/cs16/hltv.pid"]
      interval: 30s
      timeout: 10s
      retries: 5
  watch-main-main:
    build: ./watch/webxash3d-proxy
    image: csserver_wstats-watch-main
    container_name: cs16-watch-main-main
    restart: unless-stopped
    profiles: ["watch"]
    network_mode: host
    environment:
      GAME_SERVER: "127.0.0.1:27100"
      LISTEN_HOST: "0.0.0.0"
      LISTEN_PORT: "27200"
      BASE_PATH: "/zueira"
      UDP_PORT_RANGE: "27300-27363"
      CONSOLE_COMMANDS: "spec_autodirector 1"
      PACKAGE_ZIP: "/valve/valve.zip"
    volumes:
      - ./valve/valve.zip:/valve/valve.zip:ro
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:27200/health"]
      interval: 30s
      timeout: 10s
      retries: 5
